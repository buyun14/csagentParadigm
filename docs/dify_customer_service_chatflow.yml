# csagentParadigm -> Dify Chatflow DSL
# 依据 docs/Dify工作流实现方案.md 生成（2026-08-19）
# 导入步骤：Dify Studio -> 导入 DSL -> 选择本文件
# 导入后必做：为「意图分类 / 参数提取 / 话术生成」三个模型节点选择你环境里真实的模型（provider/name 当前为占位 tongyi/qwen-plus）
# 说明：为保证流式输出，参数提取/状态推进/槽位写回全部放在「话术生成 LLM」之前执行，
#       Answer 节点直接引用 LLM 节点输出（LLM -> Answer 直连），避免中间节点打断 SSE 流式首字。
app:
  mode: advanced-chat
  name: 汽车营销外呼客服Chatflow
  description: 外呼线索初筛：规则预检 + 意图分类 + 话术生成（纯文本流式）+ 参数提取 + 状态机推进（csagentParadigm 移植）
  icon: "📞"
  icon_background: "#E4FBCC"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.5.0"
workflow:
  conversation_variables:
    - id: "cvar-current-state"
      name: current_state
      value_type: string
      value: "GREETING"
      description: 当前主状态（GREETING/BRAND_INQUIRY/MODEL_INQUIRY/CITY_INQUIRY/TIMING_INQUIRY/CONTACT_COLLECTION/FAREWELL）
    - id: "cvar-exception-state"
      name: exception_state
      value_type: string
      value: "NONE"
      description: 异常标签（OFF_TRACK/ABUSE/OUT_OF_SCOPE/UNCLEAR/NONE）
    - id: "cvar-brand"
      name: brand
      value_type: string
      value: ""
      description: 已确认品牌
    - id: "cvar-series"
      name: series
      value_type: string
      value: ""
      description: 已确认车系
    - id: "cvar-model"
      name: model
      value_type: string
      value: ""
      description: 具体车型（可选）
    - id: "cvar-city"
      name: city
      value_type: string
      value: ""
      description: 已确认购车城市
    - id: "cvar-timing"
      name: timing
      value_type: string
      value: ""
      description: 已确认购车时间
    - id: "cvar-surname"
      name: surname
      value_type: string
      value: ""
      description: 客户姓氏（收集到即闭环 -> FAREWELL）
    - id: "cvar-phone-tail"
      name: phone_tail
      value_type: string
      value: ""
      description: 客户主动报的手机尾号（不主动问）
    - id: "cvar-turn-count"
      name: turn_count
      value_type: number
      value: 0
      description: 轮次计数
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: "喂，你好。这边是互联网汽车营销中心的，价格合适的话，您这边考虑过买车吗？给您做一个报价，您参考了解一下哈，您看最近有比较关注哪款车呀？"
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
