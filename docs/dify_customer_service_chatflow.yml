    nodes:
      - data:
          type: start
          title: 开始
          variables: []
        height: 54
        id: "1732000001"
        position:
          x: 40
          y: 300
        positionAbsolute:
          x: 40
          y: 300
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          type: code
          title: 规则预检（ASR归一化+固定话术）
          desc: 零LLM：ASR谐音纠错 + 反感/辱骂/等待/告别/纯问候命中即出固定话术
          variables:
            - variable: query
              value_selector:
                - sys
                - query
            - variable: current_state
              value_selector:
                - conversation
                - current_state
          code_language: python3
          code: |
            import re

            def main(query, current_state):
                text = (query or "").strip()

                # 1) ASR 结构型纠错（对应 asr-corrections.ts；中文近音由软匹配/LLM兜底）
                corrections = [
                    ("未来", "蔚来"), ("蔚莱", "蔚来"), ("笨田", "本田"),
                    ("保时姐", "保时捷"), ("保时洁", "保时捷"),
                    ("比亚滴", "比亚迪"), ("比哑滴", "比亚迪"),
                    ("位牌", "魏牌"), ("魏派", "魏牌"),
                    ("吉利新苑", "吉利星愿"), ("文件", "问界"), ("文具", "问界"),
                    ("小彭", "小鹏"), ("小朋", "小鹏"),
                    ("一十八", "ES8"), ("一艾斯八", "ES8"), ("一s八", "ES8"),
                    ("一十六", "ES6"), ("一艾斯六", "ES6"), ("一s六", "ES6"),
                    ("e三版", "E300"), ("e三班", "E300"), ("一三百", "E300"),
                    ("毛豆歪", "Model Y"), ("毛豆y", "Model Y"), ("模特y", "Model Y"), ("model歪", "Model Y"),
                    ("居老八", "GL8"), ("几十八", "GL8"), ("g老八", "GL8"),
                    ("莫娜l零三", "MONA L03"), ("莫娜l03", "MONA L03"), ("莫娜零三", "MONA L03"),
                    ("海斯", "海狮"), ("高三", "高山"), ("四七五", "CT5"),
                    ("小米舒淇", "小米SU7"), ("小米数七", "小米SU7"), ("小米数气", "小米SU7"),
                    ("小米逾期", "小米YU7"), ("小米语气", "小米YU7"),
                ]
                for src, dst in corrections:
                    text = text.replace(src, dst)
                text = re.sub(r"\bsu7\b", "SU7", text)
                text = re.sub(r"\byu7\b", "YU7", text)
                text = re.sub(r"\s+", " ", text).strip()

                # 2) 固定意图预检（词表与 intent.ts 一致；顺序：反感 -> 辱骂 -> 等待 -> 告别 -> 纯问候）
                dislike_words = ["又是推销", "别打了", "不要再打了", "烦不烦", "天天打", "怎么又打", "说了不要", "已经买过了", "不需要谢谢", "别骚扰", "拉黑", "投诉", "举报", "别烦我", "不要打", "烦死了", "骚扰"]
                abuse_words = ["滚", "傻逼", "sb", "操", "妈的", "去死", "神经病", "有病", "垃圾", "废物", "骗子", "混蛋", "无耻", "不要脸", "恶心", "讨厌", "去你妈", "你妈", "草泥马", "麻痹", "逼", "贱", "蠢", "智障"]
                wait_words = ["等一下", "等等", "稍等", "等下", "等一会", "先别急", "我想想", "让我想想", "等会", "现在忙", "在开会"]
                farewell_words = ["再见", "拜拜", "bye", "挂了", "先这样", "就这样", "好的再见", "嗯再见", "谢谢再见"]
                greet_words = ["喂", "你好", "您好", "嗨", "hi", "hello", "在吗", "在的", "嗯", "嗯嗯", "哦", "哦哦", "啊", "好的"]

                hit = False
                intent = ""
                response = ""
                next_state = current_state or "GREETING"
                exception = "NONE"

                for w in dislike_words:
                    if w in text:
                        hit, intent = True, "dislike"
                        response = "理解您的感受，那就不打扰了，如果有需要随时联系我们。"
                        next_state, exception = "FAREWELL", "ABUSE"
                        break
                if not hit:
                    for w in abuse_words:
                        if w in text:
                            hit, intent = True, "abuse"
                            response = "不好意思打扰了，祝您生活愉快，再见。"
                            next_state, exception = "FAREWELL", "ABUSE"
                            break
                if not hit:
                    for w in wait_words:
                        if w in text:
                            hit, intent = True, "wait"
                            response = "好的，您先忙，不着急。"
                            break
                if not hit:
                    for w in farewell_words:
                        if w in text:
                            hit, intent = True, "farewell"
                            response = "好的，稍后会有专人联系您，祝您生活愉快，再见。"
                            next_state, exception = "FAREWELL", "NONE"
                            break
                if not hit and current_state == "GREETING" and len(text) <= 6:
                    for w in greet_words:
                        if w in text:
                            hit, intent = True, "greet"
                            response = "喂，你好。这边是互联网汽车营销中心的，价格合适的话，您这边考虑过买车吗？给您做一个报价，您参考了解一下哈，您看最近有比较关注哪款车呀？"
                            next_state = "BRAND_INQUIRY"
                            break
                if not hit and current_state == "FAREWELL":
                    hit, intent = True, "farewell"
                    response = "好的，稍后会有专人联系您，祝您生活愉快，再见。"
                    next_state, exception = "FAREWELL", "NONE"

                return {
                    "normalized_text": text,
                    "precheck_result": "hit" if hit else "miss",
                    "precheck_intent": intent,
                    "precheck_response": response,
                    "precheck_next_state": next_state,
                    "precheck_exception": exception,
                }
          outputs:
            normalized_text:
              type: string
            precheck_result:
              type: string
            precheck_intent:
              type: string
            precheck_response:
              type: string
            precheck_next_state:
              type: string
            precheck_exception:
              type: string
        height: 220
        id: "1732000002"
        position:
          x: 320
          y: 220
        positionAbsolute:
          x: 320
          y: 220
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          type: if-else
          title: 预检是否命中
          desc: precheck_result == hit 时走固定话术（零LLM）；否则进入语义层
          logical_operator: and
          cases:
            - case_id: case-precheck-hit
              logical_operator: and
              conditions:
                - variable_selector:
                    - "1732000002"
                    - precheck_result
                  comparison_operator: is
                  value: "hit"
        height: 126
        id: "1732000003"
        position:
          x: 600
          y: 240
        positionAbsolute:
          x: 600
          y: 240
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          type: assigner
          title: 固定话术-状态写入
          desc: 写回 next_state/exception/turn_count
          version: "2"
          items:
            - variable_selector:
                - conversation
                - current_state
              input_type: variable
              operation: over-write
              value:
                - "1732000002"
                - precheck_next_state
            - variable_selector:
                - conversation
                - exception_state
              input_type: variable
              operation: over-write
              value:
                - "1732000002"
                - precheck_exception
            - variable_selector:
                - conversation
                - turn_count
              input_type: constant
              operation: "+="
              value: 1
        height: 110
        id: "1732000004"
        position:
          x: 880
          y: 180
        positionAbsolute:
          x: 880
          y: 180
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          type: answer
          title: 固定话术回复
          answer: "{{#1732000002.precheck_response#}}"
        height: 107
        id: "1732000005"
        position:
          x: 1160
          y: 180
        positionAbsolute:
          x: 1160
          y: 180
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          type: question-classifier
          title: 意图分类（19类）
