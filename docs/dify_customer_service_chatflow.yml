                "五菱宏光": "五菱", "五菱缤果": "五菱", "五菱星光": "五菱", "宏光MINIEV": "五菱",
                "享界S9": "享界", "智界R7": "智界", "智界S7": "智界", "尊界S800": "尊界",
            }

            TIMING_RULES = [
                (re.compile(r"半个多?月|两周|十几天"), "半个月后"),
                (re.compile(r"已经看过|已看过|看过车|看过了|已经去看过|已看车"), "已看车"),
                (re.compile(r"看价格|看价钱|价格合适再|等价格|看价格再说"), "看价格"),
                (re.compile(r"下个月|下月"), "下个月"),
                (re.compile(r"这个月|本月"), "本月"),
                (re.compile(r"最近|这几天|这周|本周|快了|马上|尽快|近期"), "近期"),
                (re.compile(r"还早|不着急|慢慢看|先看看"), "不着急"),
                (re.compile(r"明年"), "明年"),
                (re.compile(r"今年"), "今年"),
                (re.compile(r"年底|过年|春节前|年前"), "近期"),
            ]
            TIMING_ENUM = {"近期", "半个月后", "本月", "下个月", "今年", "明年", "不着急", "已看车", "看价格"}

            def norm_timing(raw):
                if not raw:
                    return ""
                t = raw.strip()
                if t in TIMING_ENUM:
                    return t
                for pat, val in TIMING_RULES:
                    if pat.search(t):
                        return val
                if re.match(r"^\d{1,2}月$", t):
                    return "近期"
                return t[:8]

            def main(current_state, intent, brand, series, model, city, timing, surname, phone_tail, old_brand, old_series, old_model, old_city, old_timing, old_surname, old_phone_tail):
                intent = (intent or "unknown").strip() or "unknown"
                b = (old_brand or "").strip()
                s = (old_series or "").strip()
                m = (old_model or "").strip()
                c = (old_city or "").strip()
                t = (old_timing or "").strip()
                sn = (old_surname or "").strip()
                pt = (old_phone_tail or "").strip()

                guard = intent in ("abuse", "dislike", "farewell", "wait")
                if not guard and intent != "disagree":
                    nb = (brand or "").strip()
                    ns = (series or "").strip()
                    if nb:
                        if b and nb != b:
                            s = ""  # 切换品牌 -> 清空旧车系
                        b = nb
                    if ns:
                        s = ns
                        if not b:
                            b = SERIES_TO_BRAND.get(s, "")
                    if (model or "").strip():
                        m = model.strip()
                    if (city or "").strip():
                        c = city.strip()
                    if timing:
                        nt = norm_timing(timing)
                        if nt:
                            t = nt
                    if (surname or "").strip():
                        sn = surname.strip()
                    if (phone_tail or "").strip():
                        pt = phone_tail.strip()

                info_complete = bool(b and s and c and t and sn)

                # 状态推进：只进不退 + intent 下限 + 姓氏闭环 + 槽位推导下限
                best = STATE_INDEX.get(current_state or "GREETING", 0)
                min_state = INTENT_MIN.get(intent, "")
                if min_state:
                    best = max(best, STATE_INDEX.get(min_state, -1))
                if sn or info_complete:
                    best = max(best, STATE_INDEX["FAREWELL"])
                if not b:
                    slot_state = "BRAND_INQUIRY"
                elif not s:
                    slot_state = "MODEL_INQUIRY"
                elif not c:
                    slot_state = "CITY_INQUIRY"
                elif not t:
                    slot_state = "TIMING_INQUIRY"
                elif not sn:
                    slot_state = "CONTACT_COLLECTION"
                else:
                    slot_state = "FAREWELL"
                best = max(best, STATE_INDEX[slot_state])
                new_state = STATE_ORDER[best]

                exception = "NONE"
                if intent in ("abuse", "dislike"):
                    exception = "ABUSE"
                elif intent == "off_track":
                    exception = "OFF_TRACK"
                elif intent == "out_of_scope":
                    exception = "OUT_OF_SCOPE"
                elif intent == "unclear":
                    exception = "UNCLEAR"

                if not b:
                    missing_label = "品牌"
                elif not s:
                    missing_label = "车系"
                elif not c:
                    missing_label = "购车城市"
                elif not t:
                    missing_label = "购车时间"
                elif not sn:
                    missing_label = "姓氏"
                else:
                    missing_label = "无（五项已齐，应告别）"

                return {
                    "new_state": new_state,
                    "exception_state": exception,
                    "brand": b,
                    "series": s,
                    "model": m,
                    "city": c,
                    "timing": t,
                    "surname": sn,
                    "phone_tail": pt,
                    "info_complete": info_complete,
                    "missing_label": missing_label,
                }
          outputs:
            new_state:
              type: string
            exception_state:
              type: string
            brand:
              type: string
            series:
              type: string
            model:
              type: string
            city:
              type: string
            timing:
              type: string
            surname:
              type: string
            phone_tail:
              type: string
            info_complete:
              type: boolean
            missing_label:
              type: string
